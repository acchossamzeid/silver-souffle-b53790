<style>

*{box-sizing:border-box}

button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.25}h1{font-size:1.45rem;font-weight:700}h2{font-size:1.15rem;font-weight:700}h3{font-size:1rem;font-weight:600}
a{color:var(--pet)}

.row{display:flex;gap:.6rem;align-items:center}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1;min-width:0}.col{display:flex;flex-direction:column;gap:.6rem}
.stack>*+*{margin-top:.8rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;min-height:48px;padding:.6rem 1.1rem;border-radius:10px;border:1.5px solid var(--pet);background:var(--pet);color:var(--pet-ink);font-weight:600;cursor:pointer;text-decoration:none}

.btn.sm{min-height:36px;padding:.25rem .7rem;font-size:.9rem;border-radius:8px}.btn.block{display:flex;width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed}
/* surfaces */

.chip.ok{background:var(--green-bg);color:var(--green)}.chip.warn{background:var(--amber-bg);color:var(--amber)}.chip.bad{background:var(--red-bg);color:var(--red)}.chip.grey{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.dot{width:.7rem;height:.7rem;border-radius:50%;background:currentColor;display:inline-block}
/* banners */
.banner{display:flex;align-items:center;gap:.6rem;padding:.7rem .9rem;border-radius:10px;font-weight:600;cursor:pointer}
.banner.ok{background:var(--green-bg);color:var(--green)}.banner.warn{background:var(--amber-bg);color:var(--amber)}.banner.bad{background:var(--red-bg);color:var(--red)}
.note{padding:.6rem .8rem;border-radius:10px;font-size:.9rem}.note.warn{background:var(--amber-bg);color:var(--amber)}.note.bad{background:var(--red-bg);color:var(--red)}.note.info{background:var(--pet-soft);color:var(--pet)}
/* dipstick: the one memorable element */
.dip{margin-top:.5rem}
.dip-rod{position:relative;height:34px;border-radius:6px;background:var(--bg);border:1.5px solid var(--ink);overflow:hidden;
 background-image:repeating-linear-gradient(to right,transparent 0,transparent calc(10% - 1.5px),var(--line) calc(10% - 1.5px),var(--line) 10%)}
.dip-fill{position:absolute;inset-block:0;inset-inline-start:0;background:var(--amber-fill);opacity:.92;transition:width .6s ease}

/* rep shell */

.nav button{flex:1;min-height:60px;border:0;background:none;color:var(--muted);font-size:.78rem;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer}

.bigbtns{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.bigbtn{min-height:92px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.35rem;font-weight:700;cursor:pointer;color:var(--ink)}
.bigbtn.primary{background:var(--pet);border-color:var(--pet);color:var(--pet-ink)}
.bigbtn svg{width:28px;height:28px}
.stat{flex:1;min-width:0}.stat>b{display:block;font-size:1.35rem}.stat>span{font-size:.8rem;color:var(--muted)}
.stepper{display:flex;align-items:center;gap:.4rem}.stepper button{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--pet);background:var(--surface);color:var(--pet);font-size:1.4rem;font-weight:700;cursor:pointer}
.stepper b{min-width:2.2rem;text-align:center;font-size:1.1rem}
.seg{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--pet);border-radius:10px;overflow:hidden}
.seg button{min-height:46px;border:0;background:var(--surface);color:var(--pet);font-weight:600;cursor:pointer}.seg button.on{background:var(--pet);color:var(--pet-ink)}
/* admin shell */
.adm{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--surface);border-inline-end:1px solid var(--line);padding:1rem .6rem;position:sticky;top:0;align-self:start;height:100vh;overflow:auto}
.side h2{padding:.3rem .6rem 1rem}.side button{display:block;width:100%;text-align:start;padding:.6rem .7rem;border:0;background:none;border-radius:8px;color:var(--ink);font-weight:500;cursor:pointer}
.side button.on{background:var(--pet-soft);color:var(--pet);font-weight:700}
.main{padding:1.2rem 1.4rem;min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.7rem}
.kpi>b{display:block;font-size:1.6rem}.kpi>span{color:var(--muted);font-size:.85rem}
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:.92rem}th,td{padding:.55rem .75rem;text-align:start;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-weight:600;color:var(--muted);font-size:.8rem;background:var(--bg);white-space:nowrap}tr:last-child td{border-bottom:0}
.bar{height:10px;background:var(--bg);border-radius:6px;overflow:hidden;border:1px solid var(--line)}.bar i{display:block;height:100%;background:var(--amber-fill)}
@media (max-width:860px){.adm{grid-template-columns:1fr}.side{position:static;height:auto;display:flex;overflow-x:auto;gap:.3rem;padding:.5rem;border-inline-end:0;border-bottom:1px solid var(--line)}.side h2{display:none}.side button{white-space:nowrap;width:auto}.main{padding:1rem}}
/* modal + toast + login */
.scrim{position:fixed;inset:0;background:rgba(8,16,20,.55);z-index:60;display:flex;align-items:flex-end;justify-content:center}
.modal{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:16px 16px 0 0;padding:1.1rem}
@media (min-width:700px){.scrim{align-items:center}.modal{border-radius:16px}}
.toast{position:fixed;inset-inline:1rem;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:80;max-width:480px;margin:0 auto;padding:.8rem 1rem;border-radius:10px;background:var(--ink);color:var(--bg);font-weight:600;text-align:center}
.toast.bad{background:var(--red);color:#fff}
.login{max-width:520px;margin:0 auto;padding:1.5rem 1rem}
.who{display:flex;align-items:center;gap:.8rem;width:100%;text-align:start;padding:.8rem 1rem;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);cursor:pointer;min-height:64px}
.who:hover{border-color:var(--pet)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--pet-soft);color:var(--pet);display:grid;place-items:center;font-weight:700}
.hide-print{}
@media print{.top,.nav,.hide-print,.toast{display:none!important}.rep{padding:0;max-width:none}body{background:#fff}.card{border:0;box-shadow:none}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.m{white-space:nowrap}
.row.between>span:first-child,.row.between>div:first-child{min-width:0}

<body>
<div id="root"></div>
<script>
// ===================== utilities =====================
const mem = {};
const store = {
  get(k){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : (mem[k] ? JSON.parse(mem[k]) : null); } catch(e){ return mem[k] ? JSON.parse(mem[k]) : null; } },
  set(k,v){ const s = JSON.stringify(v); mem[k] = s; try { localStorage.setItem(k, s); } catch(e){} },
  del(k){ delete mem[k]; try { localStorage.removeItem(k); } catch(e){} }
};
const r2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const uuid = () => (window.crypto && crypto.randomUUID) ? crypto.randomUUID()
  : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, c => { const r = Math.random()*16|0; return (c==='x'?r:(r&3|8)).toString(16); });
const sleep = ms => new Promise(r => setTimeout(r, ms));
const clone = o => JSON.parse(JSON.stringify(o));
function haversine(a, b){
  const R = 6371000, d = x => x*Math.PI/180;
  const dLat = d(b.lat-a.lat), dLng = d(b.lng-a.lng);
  const h = Math.sin(dLat/2)**2 + Math.cos(d(a.lat))*Math.cos(d(b.lat))*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(h));
}
class BizError extends Error {}   // server rejected (HTTP 4xx): do not blindly retry
class NetError extends Error {}   // no connection / lost response: safe to retry
const biz = m => new BizError(m);

// Asia/Riyadh helpers (storage is UTC ISO strings)
const RYD = 'Asia/Riyadh';
const dayKey = iso => new Date(iso).toLocaleDateString('en-CA', { timeZone: RYD });
const monthKey = iso => dayKey(iso).slice(0,7);
const todayKey = () => dayKey(new Date().toISOString());


// Views (security-invoker): computed on the caller's snapshot. Shared by demo and Supabase builds.
const VIEWS = {
    kpi(s, month){
      return s.targets.filter(t => t.month === month).map(t => {
        const u = s.users.find(x => x.id === t.rep_id) || {};
        const cashSale = s.invoices.filter(i => i.rep_id===t.rep_id && i.status==='posted' && monthKey(i.synced_at)===month).reduce((a,i)=>a+i.paid_at_sale,0);
        const coll = s.colls.filter(c => c.rep_id===t.rep_id && monthKey(c.collected_at)===month).reduce((a,c)=>a+c.amount,0);
        const cartons = s.invoices.filter(i => i.rep_id===t.rep_id && i.status==='posted' && monthKey(i.synced_at)===month).reduce((a,i)=>a+i.items.reduce((b,x)=>b+x.qty,0),0);
        const total = r2(cashSale + coll);
        return { rep_id:t.rep_id, name:u.full_name, target:t.collection_target, collected:total, pct:t.collection_target ? Math.round(1000*total/t.collection_target)/10 : 0, cartons, carton_target:t.carton_target };
      });
    },
    lowStock(s){ return s.wh.filter(w => w.qty <= w.reorder).map(w => ({ ...w, product:s.products.find(p => p.id===w.product_id) })); },
    outstanding(s){
      return s.customers.map(c => {
        const inv = s.invoices.filter(i => i.customer_id===c.id && i.status==='posted' && i.balance_due>0);
        const op = s.open.filter(o => o.customer_id===c.id && o.balance_due>0);
        const out = r2(inv.reduce((a,i)=>a+i.balance_due,0) + op.reduce((a,o)=>a+o.balance_due,0));
        const dues = [...inv, ...op].map(x => x.due_date).filter(Boolean).sort();
        return { customer:c, outstanding:out, oldest_due:dues[0]||null };
      }).filter(x => x.outstanding > 0);
    },
    reconcile(s){
      const bad = [];
      s.van.forEach(v => { const sum = s.moves.filter(m => m.location==='van' && m.rep_id===v.rep_id && m.product_id===v.product_id).reduce((a,m)=>a+m.delta,0); if (sum !== v.qty) bad.push({ location:'van', rep_id:v.rep_id, product_id:v.product_id, balance:v.qty, ledger:sum }); });
      s.wh.forEach(w => { const sum = s.moves.filter(m => m.location==='warehouse' && m.product_id===w.product_id).reduce((a,m)=>a+m.delta,0); if (sum !== w.qty) bad.push({ location:'warehouse', product_id:w.product_id, balance:w.qty, ledger:sum }); });
      return bad;
    },
    cashExpectedToday(s){
      const today = todayKey();
      return s.users.filter(u => u.role==='rep' && u.active).map(u => ({ rep:u,
        amount: r2(s.invoices.filter(i => i.rep_id===u.id && i.status==='posted' && dayKey(i.synced_at)===today).reduce((a,i)=>a+(i.payment_type!=='credit'?i.paid_at_sale:0),0)
          + s.colls.filter(c => c.rep_id===u.id && c.method==='cash' && dayKey(c.collected_at)===today).reduce((a,c)=>a+c.amount,0)) }));
    }
  };

// ===================== Supabase data layer (production build) =====================
const CFG = window.OILREP_CONFIG || {};
class AuthExpired extends NetError {}          // keeps queued work pending; the user just signs in again
const Net = { offline:false, loseNext:0, latency:0, blocked(){ return false; } };   // real fetch errors decide connectivity
const configOk = () => CFG.SUPABASE_URL && CFG.SUPABASE_ANON_KEY && !/YOUR-|PASTE/i.test(CFG.SUPABASE_URL + CFG.SUPABASE_ANON_KEY);

const Auth = {
  session: store.get('oilrep.session'), expired:false,
  save(s){ this.session = s; store.set('oilrep.session', s); },
  async _token(grant, body){
    let res; try { res = await fetch(CFG.SUPABASE_URL + '/auth/v1/token?grant_type=' + grant, { method:'POST', headers:{ apikey:CFG.SUPABASE_ANON_KEY, 'Content-Type':'application/json' }, body:JSON.stringify(body) }); }
    catch(e){ throw new NetError('network'); }
    if (res.status >= 500) throw new NetError('auth server');
    const j = await res.json().catch(() => ({}));
    if (!res.ok) throw new BizError(j.error_description || j.msg || j.message || 'login failed');
    this.save({ access_token:j.access_token, refresh_token:j.refresh_token, expires_at:Date.now() + (j.expires_in || 3600) * 1000, uid:j.user.id });
    this.expired = false; return this.session;
  },
  login(email, password){ return this._token('password', { email:email.trim(), password }); },
  async refresh(){
    if (!this.session) throw new AuthExpired('no session');
    try { return await this._token('refresh_token', { refresh_token:this.session.refresh_token }); }
    catch(e){ if (e instanceof BizError) { this.expired = true; throw new AuthExpired('session expired'); } throw e; }
  },
  async token(){
    if (!this.session) { this.expired = true; throw new AuthExpired('no session'); }
    if (Date.now() > this.session.expires_at - 60000) await this.refresh();
    return this.session.access_token;
  },
  logout(){ this.session = null; this.expired = false; store.del('oilrep.session'); }
};

async function rest(method, path, body, headers, retried){
  const tok = await Auth.token();
  let res;
  try {
    res = await fetch(CFG.SUPABASE_URL + '/rest/v1/' + path, { method, headers:{ apikey:CFG.SUPABASE_ANON_KEY, Authorization:'Bearer ' + tok, 'Content-Type':'application/json', ...(headers || {}) }, body:body === undefined ? undefined : JSON.stringify(body) });
  } catch(e){ Net.offline = true; throw new NetError('network'); }
  Net.offline = false;
  if (res.status === 401 && !retried) { await Auth.refresh(); return rest(method, path, body, headers, true); }
  if (res.status === 401) { Auth.expired = true; throw new AuthExpired('unauthorized'); }
  if (res.status >= 500) throw new NetError('server ' + res.status);
  const txt = await res.text(); let j = null; try { j = txt ? JSON.parse(txt) : null; } catch(e){}
  if (!res.ok) throw new BizError(res.status === 403 ? t('not_allowed') : ((j && j.message) || 'HTTP ' + res.status));
  return j;
}

// app operation name -> real database call
const rpc = (fn, args) => rest('POST', 'rpc/' + fn, args);
const patchOne = async (path, body) => { const r = await rest('PATCH', path, body, { Prefer:'return=representation' }); if (!r || !r.length) throw new BizError(t('not_allowed')); return {}; };
const OPS = {
  request_transfer:p => rpc('request_transfer', { p_client_uuid:p.client_uuid, p_items:p.items, p_notes:p.notes || null }),
  dispatch_transfer:p => rpc('dispatch_transfer', { p_transfer_id:p.transfer_id }),
  receive_transfer:p => rpc('receive_transfer', { p_transfer_id:p.transfer_id, p_received:p.received }),
  submit_invoice:p => rpc('submit_invoice', { p }),
  record_collection:p => rpc('record_collection', { p }),
  add_customer:p => rpc('add_customer', { p }),
  import_opening_receivable:p => rpc('import_opening_receivable', { p_customer:p.customer_id, p_amount:p.amount, p_due:p.due_date, p_note:p.note || null }),
  receive_from_supplier:p => rpc('receive_from_supplier', { p_product:p.product_id, p_qty:p.qty, p_note:p.note || null }),
  adjust_stock:p => rpc('adjust_stock', { p_location:p.location, p_product:p.product_id, p_rep:p.rep_id || null, p_delta:p.delta, p_reason:p.reason }),
  resolve_stock_exception:p => rpc('resolve_stock_exception', { p_id:p.id, p_note:p.note }),
  cancel_transfer:p => rpc('cancel_transfer', { p_transfer_id:p.transfer_id }),
  resolve_dispute:p => rpc('resolve_dispute', { p_transfer_id:p.transfer_id, p_note:p.note }),
  admin_set_customer:p => patchOne('customers?id=eq.' + p.id, { ...(p.credit_limit != null ? { credit_limit:p.credit_limit } : {}), ...(p.active != null ? { is_active:p.active } : {}) }),
  admin_set_reorder:p => patchOne('warehouse_inventory?product_id=eq.' + p.product_id, { reorder_level:Math.max(0, +p.reorder || 0) }),
  admin_set_rep_active:p => { if (p.rep_id === Auth.session.uid) throw new BizError(t('cant_deactivate_self')); return patchOne('sales_reps?id=eq.' + p.rep_id, { is_active:!!p.active }); },
  admin_set_target:p => rest('POST', 'rep_targets?on_conflict=rep_id,month_start', { rep_id:p.rep_id, month_start:p.month + '-01', collection_target:p.collection_target, carton_target:p.carton_target || null }, { Prefer:'resolution=merge-duplicates,return=minimal' }).then(() => ({})),
  async admin_upsert_product(p){
    const row = { sku:p.sku, brand:p.brand, product_name:p.name, viscosity_grade:p.grade, oil_type:p.type || 'other', unit_size_liters:p.liters ? +p.liters : null, units_per_carton:p.upc, price_per_carton:p.price, is_active:p.active !== false };
    if (p.id) return patchOne('products?id=eq.' + p.id, row);
    const made = await rest('POST', 'products', row, { Prefer:'return=representation' });
    await rest('POST', 'warehouse_inventory', { product_id:made[0].id, qty_on_hand:0, reorder_level:0 }, { Prefer:'return=minimal' });
    return { id:made[0].id };
  }
};
async function api(uid, name, payload){
  if (!Auth.session || Auth.session.uid !== uid) throw new AuthExpired('wrong account');
  const op = OPS[name]; if (!op) throw new BizError('unknown operation ' + name);
  return op(payload || {});
}
async function readSnap(uid){ if (!Auth.session || Auth.session.uid !== uid) throw new AuthExpired('wrong account'); return Remote.refresh(); }

// local mirror of the caller's (already RLS-filtered) data, so the existing screens can read it synchronously
const Remote = {
  snap:null,
  async refresh(){ this.snap = await rpc('get_snapshot', {}); Server.db = this.snap; return this.snap; }
};
const Server = {
  db:{ users:[], wh:[], invoices:[], open:[] },
  user(id){ const u = (this.db.users || []).find(x => x.id === id); if (u) return u; if (Dev.uid === id && Dev.st && Dev.st.cache && Dev.st.cache.me) return Dev.st.cache.me; return null; },
  role(uid){ const u = this.user(uid); return u && u.active ? u.role : null; },
  snapshot(){ return Remote.snap; },
  whRow(pid){ return (this.db.wh || []).find(w => w.product_id === pid); },
  outstanding(cid){ return r2((this.db.invoices || []).filter(i => i.customer_id === cid && i.status === 'posted').reduce((s, i) => s + i.balance_due, 0) + (this.db.open || []).filter(o => o.customer_id === cid).reduce((s, o) => s + o.balance_due, 0)); },
  views:VIEWS
};

// ===================== rep device: local storage, outbox, sync worker =====================
const BACKOFF = [5, 15, 60, 300];
const Dev = {
  uid:null, st:null, syncing:false, timer:null, onChange:()=>{},
  load(uid){
    this.uid = uid;
    this.st = store.get('oilrep.dev.' + uid) || { outbox:[], cache:null, inv:{}, draft:null, gps:'at_shop', pos:{ lat:24.7136, lng:46.6753 }, lastSync:null };
  },
  save(){ store.set('oilrep.dev.' + this.uid, this.st); },
  pending(){ return this.st.outbox.filter(o => o.status === 'pending' || o.status === 'sending').length; },
  failed(){ return this.st.outbox.filter(o => o.status === 'failed'); },
  syncState(){ return this.failed().length ? 'bad' : this.pending() ? 'warn' : 'ok'; },
  enqueue(op, client_uuid, payload){
    this.st.outbox.push({ id:uuid(), op_type:op, rpc:op, client_uuid, payload, status:'pending', attempts:0, last_error:null, created_at:Date.now(), nextTryAt:0 });
    this.save(); setTimeout(() => this.sync(false), 50);
  },
  start(){ this.stop(); this.timer = setInterval(() => this.sync(false), 4000); },   // spec: every 60 s; shortened so the demo is lively
  stop(){ if (this.timer) clearInterval(this.timer); this.timer = null; },

  async refresh(){
    if (Net.blocked() || this.pending() > 0 || this.failed().length) return false;     // spec: refresh only after the outbox drains
    try {
      const s = await readSnap(this.uid);
      this.st.cache = { at:Date.now(), me:s.me, regions:s.regions, products:s.products, customers:s.customers, van:s.van, transfers:s.transfers,
        invoices:s.invoices, colls:s.colls, open:s.open, targets:s.targets, visits:s.visits };
      // local records that the server now owns can go
      Object.keys(this.st.inv).forEach(k => { if (this.st.inv[k].status === 'synced') delete this.st.inv[k]; });
      this.st.outbox = this.st.outbox.filter(o => o.status !== 'synced' || Date.now() - o.created_at < 600000);
      this.save(); return true;
    } catch(e){ return false; }
  },

  async sync(manual){
    if (this.syncing || Net.blocked()) return;
    const now = Date.now();
    const rows = this.st.outbox.filter(o => (o.status === 'pending' && (manual || o.nextTryAt <= now)) || (manual && o.status === 'failed'));
    if (!rows.length) { if (this.st.cache === null || !this.st.cache.at || (this.pending() === 0 && !this.failed().length && now - (this.st.cache.at||0) > 30000)) { await this.refresh(); this.onChange(); } return; }
    this.syncing = true; this.onChange();
    try {
      for (const o of rows.sort((a,b) => a.created_at - b.created_at)) {
        o.status = 'sending'; this.save();
        try {
          const res = await api(this.uid, o.rpc, o.payload);
          o.status = 'synced'; o.result = res; o.last_error = null; this.applySynced(o, res);
        } catch(e) {
          if (e instanceof NetError) { o.status = 'pending'; o.attempts++; o.nextTryAt = Date.now() + BACKOFF[Math.min(o.attempts-1, 3)]*1000; this.save(); break; }
          o.status = 'failed'; o.last_error = e.message; this.markFailed(o); this.save(); break;   // business error: stop and alert
        }
        this.save(); this.onChange();
      }
      this.st.lastSync = Date.now();
    } finally { this.syncing = false; this.save(); }
    if (this.pending() === 0 && !this.failed().length) await this.refresh();
    this.onChange();
  },
  applySynced(o, res){
    if (o.op_type === 'submit_invoice') {
      const l = this.st.inv[o.client_uuid]; if (l) Object.assign(l, { status:'synced', number:res.invoice_number, total:res.total, balance_due:res.balance_due, flags:res.flags, invoice_id:res.invoice_id });
    }
  },
  markFailed(o){ const l = this.st.inv[o.client_uuid]; if (l) l.status = 'failed'; },
  retry(id){ const o = this.st.outbox.find(x => x.id === id); if (o) { o.status = 'pending'; o.nextTryAt = 0; this.save(); this.sync(true); } },
  discard(id){
    const o = this.st.outbox.find(x => x.id === id); if (!o) return;
    this.st.outbox = this.st.outbox.filter(x => x.id !== id); delete this.st.inv[o.client_uuid]; this.save();
    this.refresh().then(() => this.onChange());
  },

  // ---------- cache accessors (always work offline)
  c(){ return this.st.cache || { products:[], customers:[], van:[], transfers:[], invoices:[], colls:[], open:[], targets:[], visits:[], regions:[] }; },
  vanQty(pid){ const v = this.c().van.find(x => x.product_id === pid); return v ? v.qty : 0; },
  product(pid){ return this.c().products.find(p => p.id === pid); },
  customer(cid){ return this.c().customers.find(c => c.id === cid); },
  estimate(items){
    let sub = 0, vat = 0;
    Object.entries(items).forEach(([pid, q]) => { const p = this.product(+pid); if (p && q > 0) { sub += q * p.price; vat += r2(q * p.price * p.vat / 100); } });
    return { subtotal:r2(sub), vat:r2(vat), total:r2(sub + vat) };
  },
  allInvoices(){
    const c = this.c(), srv = c.invoices.map(i => ({ ...i, _state:'synced' }));
    const seen = new Set(srv.map(i => i.client_uuid));
    const loc = Object.values(this.st.inv).filter(l => !seen.has(l.client_uuid)).map(l => ({
      id:null, client_uuid:l.client_uuid, invoice_number:l.number, customer_id:l.customer_id, shop_name_snapshot:l.shop, payment_type:l.payment_type,
      total:l.total || l.est_total, paid_at_sale:l.paid, amount_paid:l.paid, balance_due:l.balance_due != null ? l.balance_due : r2((l.est_total||0) - l.paid), due_date:l.due,
      synced_at:new Date(l.created_at).toISOString(), device_created_at:new Date(l.created_at).toISOString(), status:'posted', flags:l.flags||[],
      items:Object.entries(l.items).map(([p,q]) => ({ product_id:+p, qty:q, unit_price:(this.product(+p)||{}).price||0, line_total:r2(q*((this.product(+p)||{}).price||0)) })),
      _state: l.status === 'failed' ? 'failed' : (l.status === 'synced' ? 'synced' : 'pending'), _err:(this.st.outbox.find(o => o.client_uuid === l.client_uuid)||{}).last_error }));
    return [...loc, ...srv].sort((a,b) => new Date(b.device_created_at) - new Date(a.device_created_at));
  },
  // credit documents the rep can collect against, with pending local collections already applied
  openItems(cid){
    const c = this.c(), applied = {};
    this.st.outbox.filter(o => o.op_type === 'record_collection' && o.status !== 'synced').forEach(o => {
      const k = o.payload.invoice_id ? 'i' + o.payload.invoice_id : 'o' + o.payload.opening_receivable_id; applied[k] = (applied[k]||0) + o.payload.amount; });
    const out = [];
    c.invoices.filter(i => i.customer_id === cid && i.status === 'posted' && i.balance_due > 0).forEach(i => out.push({ kind:'invoice', id:i.id, label:i.invoice_number, due:i.due_date, balance:r2(i.balance_due - (applied['i'+i.id]||0)) }));
    c.open.filter(o => o.customer_id === cid && o.balance_due > 0).forEach(o => out.push({ kind:'opening', id:o.id, label:o.note || 'Opening balance', due:o.due_date, balance:r2(o.balance_due - (applied['o'+o.id]||0)) }));
    return out.filter(x => x.balance > 0).sort((a,b) => String(a.due).localeCompare(String(b.due)));
  },
  outstanding(cid){ return r2(this.openItems(cid).reduce((s,x) => s + x.balance, 0)); },
  pseudoSnap(){
    const c = this.c(), me = c.me || { id:this.uid, full_name:'' };
    const pend = this.allInvoices().filter(i => i._state !== 'synced').map(i => ({ ...i, rep_id:this.uid }));
    const pendColl = this.st.outbox.filter(o => o.op_type === 'record_collection' && o.status !== 'synced').map(o => ({ rep_id:this.uid, amount:o.payload.amount, method:o.payload.method, collected_at:o.payload.collected_at }));
    return { targets:c.targets, users:[me], invoices:[...c.invoices.filter(i => i.rep_id === this.uid), ...pend], colls:[...c.colls, ...pendColl] };
  },

  // ---------- simulated GPS (the sandbox cannot give real coordinates)
  gps(cust){
    const m = this.st.gps; if (m === 'denied') return { denied:true };
    const base = cust && cust.loc ? cust.loc : this.st.pos, j = () => (Math.random() - .5) * 0.00018;
    if (m === 'near') return { lat:base.lat + 0.0008, lng:base.lng, acc:20 };
    if (m === 'far') return { lat:base.lat + 0.08, lng:base.lng + 0.03, acc:15 };
    if (m === 'poor') return { lat:base.lat + j(), lng:base.lng + j(), acc:180 };
    if (m === 'mock') return { lat:base.lat + j(), lng:base.lng + j(), acc:8, mock:true };
    return { lat:base.lat + j(), lng:base.lng + j(), acc:12 };
  }
};

// ===================== real GPS (replaces the demo simulator) =====================
const RealGPS = {
  pos:null, denied:false, on:false,
  start(){
    if (this.on) return; this.on = true;
    if (!navigator.geolocation) { this.denied = true; return; }
    navigator.geolocation.watchPosition(
      p => { this.pos = { lat:p.coords.latitude, lng:p.coords.longitude, acc:p.coords.accuracy, at:Date.now() }; this.denied = false; },
      e => { if (e.code === 1) this.denied = true; },
      { enableHighAccuracy:true, maximumAge:10000, timeout:30000 });
  }
};
// Browsers cannot detect mock-location apps; that flag only comes from a native build.
Dev.gps = function(){
  RealGPS.start();
  if (RealGPS.denied) return { denied:true };
  if (!RealGPS.pos || Date.now() - RealGPS.pos.at > 180000) return { denied:true, nofix:true };
  return { lat:RealGPS.pos.lat, lng:RealGPS.pos.lng, acc:RealGPS.pos.acc };
};

function go(s, p, opts){

}

function openModal(html){ closeModal(); const d = document.createElement('div'); d.className = 'scrim'; d.id = 'modal'; d.innerHTML = `<div class="modal" role="dialog" aria-modal="true">${html}</div>`; d.addEventListener('click', e => { if (e.target === d && !_formBusy) closeModal(); }); document.body.appendChild(d); const f = d.querySelector('input,select,textarea'); if (f) f.focus(); }
function closeModal(){ const m = $('#modal'); if (m) m.remove(); }
let _formCb = null;
let _formBusy = false;
function openForm(title, fields, onSubmit, submitLabel){
  _formCb = onSubmit;
  const fh = fields.map(f => {
    const id = f.domId || 'f_' + f.id, v = f.value == null ? '' : f.value;
    let inp;
    if (f.type === 'select') inp = `<select id="${id}">${f.options.map(o => `<option value="${esc(o[0])}" ${String(o[0]) === String(v) ? 'selected' : ''}>${esc(o[1])}</option>`).join('')}</select>`;
    else if (f.type === 'textarea') inp = `<textarea id="${id}" rows="2">${esc(v)}</textarea>`;
    else if (f.type === 'file') inp = `<input id="${id}" type="file" accept=".pdf,application/pdf" aria-describedby="${id}_hint ${id}_error" data-oc="validateCustomerPdf"><span id="${id}_error" class="small field-error" role="alert"></span>${f.customerId ? `<div id="customer_pdf_current" class="small muted" aria-live="polite">${t('pdf_loading')}</div>` : ''}`;
    else inp = `<input id="${id}" type="${f.type || 'text'}" value="${esc(v)}" ${f.min != null ? 'min="' + f.min + '"' : ''} ${f.step ? 'step="' + f.step + '"' : ''} inputmode="${f.type === 'number' ? 'decimal' : 'text'}">`;
    return `<div class="field"><label for="${id}">${esc(f.label)}</label>${inp}${f.hint ? `<span id="${id}_hint" class="small muted">${esc(f.hint)}</span>` : ''}</div>`;
  }).join('');
  openModal(`<h2>${esc(title)}</h2><div class="stack" style="margin-top:1rem">${fh}</div><div id="form_status" class="small" role="status" aria-live="polite"></div><div class="row" style="margin-top:1.2rem"><button class="btn grow" data-a="formSubmit">${esc(submitLabel || t('save'))}</button><button class="btn ghost" data-a="closeModal">${t('cancel')}</button></div>`);
  _formFields = fields;
  const documentField = fields.find(field => field.type === 'file' && field.customerId);
  if (documentField) loadCustomerDocument(documentField.customerId);
}
let _formFields = [];
function formValues(){ const o = {}; _formFields.forEach(f => { const el = $('#' + (f.domId || 'f_' + f.id)); o[f.id] = el ? (f.type === 'file' ? el.files[0] || null : el.value) : ''; }); return o; }

function customerPdfField(customerId){ return { id:'customer_pdf', domId:'customer_pdf', type:'file', label:t('customer_pdf'), hint:t('pdf_hint'), customerId }; }
function pdfMetadataValid(file){ return !file || (/\.pdf$/i.test(file.name) && !/[\u0000-\u001f\u007f/\\]/.test(file.name) && file.name.length <= 255 && file.size > 0 && file.size <= 5 * 1024 * 1024 && (!file.type || file.type === 'application/pdf')); }
function validateCustomerPdf(input){
  const valid = pdfMetadataValid(input.files[0]);
  input.setCustomValidity(valid ? '' : t('pdf_invalid'));
  input.setAttribute('aria-invalid', String(!valid));
  const error = $('#customer_pdf_error'); if (error) error.textContent = valid ? '' : t('pdf_invalid');
  return valid;
}
function formStatus(message, bad){ const box = $('#form_status'); if (box) { box.textContent = message; box.className = bad ? 'small field-error' : 'small muted'; } }
async function documentRequest(customerId, options, query){
  let response;
  try { response = await fetch('/.netlify/functions/customer-document?customer=' + encodeURIComponent(customerId) + (query || ''), { ...options, cache:'no-store', headers:{ Authorization:'Bearer ' + await Auth.token(), ...(options && options.headers || {}) } }); }
  catch(error){ throw new NetError(t('no_connection')); }
  if (response.status === 401) { Auth.expired = true; throw new AuthExpired(t('sign_in')); }
  if (!response.ok) {
    const result = await response.json().catch(() => ({}));
    throw new BizError(t(result.error === 'no_document' ? 'pdf_no_document' : result.error === 'invalid_pdf' ? 'pdf_invalid' : response.status === 403 ? 'not_allowed' : 'pdf_unavailable'));
  }
  return response;
}
async function loadCustomerDocument(customerId){
  const box = $('#customer_pdf_current');
  try {
    const document = await (await documentRequest(customerId)).json();
    if (box && box.isConnected) box.innerHTML = `<div>${esc(document.filename)} · <span class="num">${(document.size / 1024 / 1024).toFixed(2)} MB</span></div><button class="btn ghost sm" data-a="downloadCustomerPdf" data-id="${esc(customerId)}">${t('pdf_download')}</button>`;
  } catch(error){ if (box && box.isConnected) box.textContent = error.message; }
}
async function uploadCustomerPdf(customerId, file){
  const { uploadId } = await (await documentRequest(customerId, { method:'POST', headers:{ 'Content-Type':'application/json' }, body:JSON.stringify({ filename:file.name, size:file.size }) })).json();
  const chunkSize = 1024 * 1024;
  for (let offset = 0; offset < file.size; offset += chunkSize) {
    formStatus(t('pdf_uploading', Math.round(offset / file.size * 100)));
    await documentRequest(customerId, { method:'PUT', headers:{ 'Content-Type':'application/octet-stream' }, body:file.slice(offset, offset + chunkSize) }, '&upload=' + uploadId + '&part=' + offset / chunkSize);
  }
  await documentRequest(customerId, { method:'POST' }, '&upload=' + uploadId);
  formStatus(t('pdf_uploading', 100));
}
function newCustomerSaver(){
  let customerId = null;
  let customerSaved = false;
  let previousIds = null;
  let savedPayload = null;
  const saveCustomer = async (payload, file) => {
    try {
      if (savedPayload) payload = savedPayload;
      if (!customerId) {
        if (!previousIds) previousIds = new Set((Server.db.customers || []).map(customer => String(customer.id)));
        const result = await api(App.uid, 'add_customer', payload);
        customerSaved = true;
        savedPayload = payload;
        const modal = $('#modal');
        if (modal) modal.querySelectorAll('input:not([type=file]),select,textarea').forEach(control => control.dataset.customerSaved = 'true');
        customerId = typeof result === 'number' || typeof result === 'string' ? result : result && (result.customer_id || result.id);
        await Remote.refresh();
        if (!customerId) {
          const matches = Server.db.customers.filter(customer => customer.client_uuid === payload.client_uuid || (!previousIds.has(String(customer.id)) && customer.shop_name === payload.shop_name && String(customer.region_id) === String(payload.region_id)));
          if (matches.length === 1) customerId = matches[0].id;
        }
      }
      if (file) {
        if (!customerId) throw new BizError(t('pdf_partial'));
        await uploadCustomerPdf(customerId, file);
      }
      if (Dev.uid) await Dev.refresh();
      toast(t('saved')); closeModal(); render();
    } catch(error){
      if (customerSaved && file) throw new BizError(t('pdf_partial'));
      throw error;
    }
  };
  saveCustomer.hasSaved = () => customerSaved;
  return saveCustomer;
}

function render(){

  if (!App.uid || (typeof Auth !== 'undefined' && Auth.expired)) { root.innerHTML = (typeof loginViewRemote === 'function' ? loginViewRemote : loginView)(); return; }
  const me = Server.user(App.uid);
  if (!me || !me.active) { root.innerHTML = inactiveView(); return; }

}
function softRender(){
  if (!App.uid) return; const me = Server.user(App.uid); if (!me) return;
  const busy = $('#modal') || (document.activeElement && ['INPUT', 'SELECT', 'TEXTAREA'].includes(document.activeElement.tagName));
  const passive = ['home', 'stock', 'invoices', 'settings', 'transfers', 'invoice'];
  if (me.role === 'rep' && passive.includes(App.route.s) && !busy) { const y = window.scrollY; render(); window.scrollTo(0, y); return; }
  document.querySelectorAll('#syncpill').forEach(el => { el.outerHTML = syncPill(); });
  const b = $('#syncbanner'); if (b) b.outerHTML = syncBanner();
}

    openForm(p.id ? t('edit') : t('add_product'), [{ id:'sku', label:t('sku'), value:p.sku }, { id:'brand', label:t('brand'), value:p.brand }, { id:'name', label:t('product'), value:p.name }, { id:'grade', label:t('viscosity'), value:p.grade },
      { id:'liters', label:t('liters'), type:'number', value:p.liters }, { id:'upc', label:t('units_per_carton'), type:'number', value:p.upc, min:1 }, { id:'price', label:t('price_carton'), type:'number', value:p.price, min:0, hint:t('price_note') },
      { id:'active', label:t('status'), type:'select', value:p.id && !p.active ? '0' : '1', options:[['1', t('active')], ['0', t('inactive')]] }],
      v => admCall('admin_upsert_product', { id:p.id, sku:v.sku.trim(), brand:v.brand.trim(), name:v.name.trim(), grade:v.grade.trim(), type:p.type, liters:v.liters, upc:Number(v.upc), price:Number(v.price), active:v.active === '1' })); },
  setTarget(el){ const month = todayKey().slice(0, 7), tg = AS().targets.find(x => x.rep_id === el.dataset.id && x.month === month) || {};
    openForm(t('set_target'), [{ id:'c', label:t('collection_target'), type:'number', value:tg.collection_target || 100000, min:0 }, { id:'k', label:t('carton_target'), type:'number', value:tg.carton_target || '' }], v => admCall('admin_set_target', { rep_id:el.dataset.id, month, collection_target:Number(v.c), carton_target:v.k })); },
  toggleRep(el){ const u = Server.user(el.dataset.id); if (confirm(u.active ? t('deactivate_confirm') : t('activate_confirm'))) admCall('admin_set_rep_active', { rep_id:u.id, active:!u.active }); },
};
document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (!el) return; if (el.tagName === 'A') e.preventDefault(); const f = Act[el.dataset.a]; if (f) f(el, e); });
document.addEventListener('input', e => { const el = e.target.closest('[data-oi]'); if (el && Act[el.dataset.oi]) Act[el.dataset.oi](el, e); });
document.addEventListener('change', e => {
  const el = e.target.closest('[data-oc]'); if (!el) return;
  if (el.dataset.oc === 'admFilter') { App.f[el.dataset.g][el.dataset.k] = el.value; render(); return; }
  if (Act[el.dataset.oc]) Act[el.dataset.oc](el, e);
});


// ===================== production login, resume, settings panel =====================
function loginViewRemote(){
  const exp = Auth.expired && App.uid;
  if (!configOk()) return `<div class="login stack"><h1>${t('app_name')}</h1><div class="note bad">${t('config_missing')}</div></div>`;
  return `<div class="login stack"><div class="row between"><h1>${t('app_name')}</h1><button class="btn ghost sm" data-a="lang" data-l="${App.lang === 'ar' ? 'en' : 'ar'}">${App.lang === 'ar' ? 'English' : 'العربية'}</button></div>
    <div class="muted">${t('login_tag')}</div>${exp ? `<div class="note warn">${t('session_expired')}</div>` : ''}<div id="loginerr"></div>
    <div class="field"><label for="em">${t('email')}</label><input id="em" type="email" autocomplete="username" inputmode="email" dir="ltr"></div>
    <div class="field"><label for="pw">${t('password')}</label><input id="pw" type="password" autocomplete="current-password" dir="ltr"></div>
    <button class="btn block" data-a="doLogin">${t('sign_in')}</button></div>`;
}
function demoPanelRemote(){
  openModal(`<div class="row between"><h2>${t('settings_short')}</h2><button class="btn ghost sm" data-a="closeModal">${t('close')}</button></div>
    <div class="stack" style="margin-top:1rem"><button class="btn ghost block" data-a="lang" data-l="${App.lang === 'ar' ? 'en' : 'ar'}">${App.lang === 'ar' ? 'English' : 'العربية'}</button>
    <button class="btn danger block" data-a="logout">${t('logout')}</button><div class="muted small">${t('version_label')} 1.0.0</div></div>`);
}
async function enterApp(uid){
  App.uid = uid;
  const me = Server.user(uid); if (!me) { Auth.logout(); App.uid = null; render(); return; }
  if (me.role === 'rep') { Dev.load(uid); RealGPS.start(); }      // start listening for a fix right away
  App.route = { s:me.role === 'rep' ? 'home' : (me.role === 'admin' ? 'dash' : 'transfers'), p:{} };
  App.hist = []; afterLogin(); if (me.role === 'rep' && me.active) { await Dev.refresh(); Dev.sync(true); } render(); window.scrollTo(0, 0);
}
Act.doLogin = async function(){
  const em = ($('#em') || {}).value || '', pw = ($('#pw') || {}).value || '', box = $('#loginerr');
  if (!em || !pw) return;
  try {
    await Auth.login(em, pw); await Remote.refresh(); await enterApp(Auth.session.uid);
  } catch(e){ if (box) box.innerHTML = `<div class="note bad">${e instanceof NetError ? t('no_connection') : t('bad_login')}</div>`; }
};
Act.loginAs = undefined;
window.addEventListener('online', () => { if (Dev.uid) Dev.sync(true); });

(async function boot(){
  const prefs = store.get('oilrep.app') || {}; if (prefs.lang) App.lang = prefs.lang;
  applyLang();
  if (!configOk() || !Auth.session) { render(); return; }
  const uid = Auth.session.uid;
  try { await Remote.refresh(); }
  catch(e){
    if (e instanceof AuthExpired) { App.uid = uid; Auth.expired = true; Dev.load(uid); render(); return; }
    // offline start: use what this phone already downloaded
    Dev.load(uid); if (!Dev.st.cache) { render(); return; }
  }
  await enterApp(uid);
})();
if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => {});


</script>
